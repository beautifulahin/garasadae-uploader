name: 🐞 오류 신고
description: 프로그램이 제대로 동작하지 않을 때
title: "[오류] "
labels: ["🐞 오류", "🆕 접수"]
body:
  - type: markdown
    attributes:
      value: |
        불편을 드려 죄송합니다. 아래를 알려주시면 빠르게 고칠 수 있습니다.
        프로그램의 **의견 보내기** 탭에서 보내시면 이 내용이 자동으로 채워집니다.
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요?
      placeholder: 어떤 화면에서 무엇을 눌렀을 때 어떻게 되었는지 적어주세요.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 환경
      placeholder: 예) 맥 · 프로그램 1.5.6
  - type: textarea
    id: log
    attributes:
      label: 기록 (있으면)
      description: 프로그램 기록 탭 아래쪽 내용을 붙여넣어 주세요.
      render: text
