<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가라사대 업로더</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap');
:root{--bg:#0b0b11;--bg1:#111119;--bg2:#1a1a25;--bg3:#22222f;--bg4:#2b2b3a;--accent:#ff4466;--accentG:rgba(255,68,102,.25);--blue:#4c8dff;--blueG:rgba(76,141,255,.15);--cyan:#2dd4a8;--cyanG:rgba(45,212,168,.12);--gold:#f0b429;--t1:#ededf4;--t2:#8e8ea8;--t3:#5a5a72;--bdr:#262638;--r:10px;--rs:7px}
*{margin:0;padding:0;box-sizing:border-box}html{zoom:1.25}/* 화면 전체 125% — 글자가 너무 작다 (사용자 지시 2026-08-25) */body{background:var(--bg);color:var(--t1);font-family:'Noto Sans KR',sans-serif;min-height:100vh;font-size:14px;overflow-x:hidden}button{font-family:inherit;cursor:pointer}input,textarea,select{font-family:inherit}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px}

.hdr{position:sticky;top:0;z-index:100;background:rgba(11,11,17,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--bdr);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}.logo em{width:30px;height:30px;background:linear-gradient(135deg,var(--accent),#ff8844);border-radius:8px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:15px}.logo b{background:linear-gradient(135deg,var(--accent),#ff8844);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-r{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.api-in{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--rs);padding:6px 10px;color:var(--t1);font-size:11px;width:230px;font-family:'JetBrains Mono',monospace}.api-in:focus{outline:none;border-color:var(--blue)}.api-in::placeholder{color:var(--t3)}
.sm{padding:5px 10px;border-radius:var(--rs);border:1px solid var(--bdr);background:var(--bg2);color:var(--t2);font-size:11px;transition:.2s}.sm:hover{border-color:var(--cyan);color:var(--cyan)}.sm.ok{border-color:var(--cyan);color:var(--cyan)}
.sm.login{border-color:var(--accent);color:var(--accent)}.sm.login:hover{background:var(--accentG)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--t3);margin-right:2px}.dot.on{background:var(--cyan);box-shadow:0 0 6px var(--cyanG)}.dot.err{background:var(--accent)}
.api-st{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t3)}
.me{display:none;align-items:center;gap:6px;padding:3px 10px 3px 3px;background:var(--bg2);border:1px solid var(--bdr);border-radius:20px}.me.on{display:flex}
.me img{width:24px;height:24px;border-radius:50%;object-fit:cover;background:var(--bg3)}.me b{font-size:12px}.me span{font-size:10px;color:var(--t3);font-family:'JetBrains Mono',monospace}

.tabs{display:flex;background:var(--bg1);border-bottom:1px solid var(--bdr)}.tab{flex:1;padding:11px;text-align:center;font-size:13px;font-weight:600;color:var(--t3);border:none;background:none;border-bottom:2px solid transparent;transition:.2s}.tab:hover{color:var(--t2);background:var(--bg2)}.tab.on{color:var(--accent);border-bottom-color:var(--accent);background:var(--bg)}

.body{display:flex;min-height:calc(100vh - 100px)}.side{width:290px;min-width:290px;background:var(--bg1);border-right:1px solid var(--bdr);overflow-y:auto;max-height:calc(100vh - 100px);position:sticky;top:100px}.content{flex:1;padding:20px;overflow-y:auto;min-width:0}
.tp{display:none}.tp.on{display:flex}.tp.solo.on{display:block;padding:20px}

.s-pad{padding:12px 14px}
.sec{border-bottom:1px solid var(--bdr)}.sec-h{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}.sec-h:hover{background:rgba(255,255,255,.02)}.sec-lbl{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.5px}.sec-arr{font-size:9px;color:var(--t3);transition:transform .2s}.sec.shut .sec-b{display:none}.sec.shut .sec-arr{transform:rotate(-90deg)}.sec-b{padding:4px 14px 12px}

.pills{display:flex;flex-wrap:wrap;gap:4px}.p{padding:5px 10px;border-radius:14px;font-size:11px;border:1px solid var(--bdr);background:none;color:var(--t2);transition:.15s;white-space:nowrap}.p:hover{border-color:var(--blue);color:var(--t1)}.p.on{background:var(--blue);border-color:var(--blue);color:#fff}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:4px}.ch{padding:8px 6px;border-radius:var(--rs);border:1px solid var(--bdr);background:var(--bg2);color:var(--t2);transition:.15s;text-align:center;font-size:12px}.ch:hover{border-color:var(--blue);color:var(--t1)}.ch.on{border-color:var(--blue);color:var(--blue);background:var(--blueG)}.ch b{display:block;font-size:12px;font-weight:700}.ch small{font-size:9px;color:var(--t3);margin-top:1px;display:block}.ch.on small{color:var(--blue);opacity:.6}
.fin{width:100%;padding:8px 10px;background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--rs);color:var(--t1);font-size:12px}.fin:focus{outline:none;border-color:var(--blue)}.fin::placeholder{color:var(--t3)}
textarea.fin{resize:vertical;line-height:1.6}
.sw{display:flex;align-items:center;justify-content:space-between;padding:7px 0;font-size:12px;color:var(--t2)}
.tgl{position:relative;width:36px;height:20px;background:var(--bg3);border:1px solid var(--bdr);border-radius:12px;transition:.2s;flex-shrink:0}.tgl::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--t3);transition:.2s}.tgl.on{background:var(--blueG);border-color:var(--blue)}.tgl.on::after{left:18px;background:var(--blue)}
.go{width:100%;padding:12px;border-radius:var(--r);border:none;background:linear-gradient(135deg,var(--accent),#ff8844);color:#fff;font-size:14px;font-weight:700;transition:.2s;display:flex;align-items:center;justify-content:center;gap:6px}.go:hover{filter:brightness(1.1);transform:translateY(-1px)}.go:disabled{opacity:.4;cursor:default;transform:none}
.go2{width:100%;padding:9px;margin-top:6px;border-radius:var(--rs);border:1px solid var(--bdr);background:none;color:var(--t2);font-size:12px;font-weight:600;transition:.15s}.go2:hover{border-color:var(--blue);color:var(--blue)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.st{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:14px}.st-lbl{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}.st-val{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;background:linear-gradient(135deg,var(--accent),#ff8844);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

.drop{border:2px dashed var(--bdr);border-radius:var(--r);padding:34px 20px;text-align:center;cursor:pointer;transition:.2s;background:var(--bg1);margin-bottom:16px}
.drop:hover,.drop.hot{border-color:var(--accent);background:var(--bg2)}.drop.hot{box-shadow:0 0 20px var(--accentG)}
.drop-i{font-size:38px;margin-bottom:8px;opacity:.6}.drop-t{font-size:15px;font-weight:700;margin-bottom:4px}.drop-d{font-size:12px;color:var(--t3);line-height:1.6}

.qlist{display:flex;flex-direction:column;gap:10px}
.qc{background:var(--bg2);border:2px solid var(--bdr);border-radius:var(--r);overflow:hidden;transition:.2s;animation:fu .3s ease both}
.qc.s-up{border-color:var(--blue);box-shadow:0 0 12px var(--blueG)}
.qc.s-done{border-color:var(--cyan);box-shadow:0 0 10px var(--cyanG)}
.qc.s-err{border-color:var(--accent);box-shadow:0 0 10px var(--accentG)}
.qc-top{display:flex;gap:12px;padding:12px;align-items:flex-start}
.qc-th{width:140px;min-width:140px;aspect-ratio:16/9;background:var(--bg3);border-radius:var(--rs);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:26px;opacity:.9}
.qc-th img{width:100%;height:100%;object-fit:cover}.qc-dur{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.8);color:#fff;font-size:10px;font-family:'JetBrains Mono',monospace;padding:2px 5px;border-radius:3px}
.qc-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.qc-file{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--t3);font-family:'JetBrains Mono',monospace}
.qc-file b{color:var(--t2);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.badge{padding:2px 8px;border-radius:10px;font-size:9px;font-weight:700;flex-shrink:0;letter-spacing:.3px}
.badge.wait{background:var(--bg4);color:var(--t2)}.badge.up{background:var(--blueG);color:var(--blue)}.badge.done{background:var(--cyanG);color:var(--cyan)}.badge.err{background:var(--accentG);color:var(--accent)}
.qc-x{margin-left:auto;border:none;background:none;color:var(--t3);font-size:14px;padding:0 2px;flex-shrink:0}.qc-x:hover{color:var(--accent)}
.cnt{font-size:9px;color:var(--t3);text-align:right;font-family:'JetBrains Mono',monospace;margin-top:-3px}
.qc-more{padding:0 12px 12px;display:none}.qc-more.show{display:block}
.qc-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:0 12px 10px}
.tb{padding:4px 10px;border-radius:var(--rs);border:1px solid var(--bdr);background:none;color:var(--t2);font-size:10px;transition:.15s}.tb:hover{border-color:var(--blue);color:var(--blue)}.tb.on{border-color:var(--cyan);color:var(--cyan)}
.rb{background:var(--bg3);border-radius:3px;height:4px;overflow:hidden;margin:0 12px 6px}.rf{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),#ff8844);width:0;transition:width .2s}
.rl{display:flex;justify-content:space-between;font-size:9px;padding:0 12px 10px;font-family:'JetBrains Mono',monospace}.rl span:first-child{color:var(--t3)}.rl span:last-child{color:var(--accent);font-weight:700}
.qc-link{display:block;margin:0 12px 12px;padding:7px;border-radius:var(--rs);border:1px solid var(--cyan);color:var(--cyan);font-size:11px;font-weight:600;text-align:center;text-decoration:none;transition:.15s}.qc-link:hover{background:var(--cyanG)}
.qc-err{margin:0 12px 12px;padding:8px 10px;border-radius:var(--rs);background:var(--accentG);color:var(--accent);font-size:11px;line-height:1.5;word-break:break-word}

.stit{font-size:16px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}.ssub{font-size:12px;color:var(--t3);margin-bottom:14px;line-height:1.6}
.empty{text-align:center;padding:60px 30px}.empty-i{font-size:48px;margin-bottom:12px;opacity:.4}.empty-t{font-size:17px;font-weight:700;margin-bottom:6px}.empty-d{font-size:13px;color:var(--t3);line-height:1.7}

.hrow{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--rs);margin-bottom:6px;transition:.15s}.hrow:hover{border-color:var(--blue)}
.hrow-th{cursor:pointer;width:64px;min-width:64px;aspect-ratio:16/9;border-radius:5px;overflow:hidden;background:var(--bg3)}.hrow-th img{width:100%;height:100%;object-fit:cover}
.hrow-i{flex:1;min-width:0}.hrow-t{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hrow-m{font-size:10px;color:var(--t3);font-family:'JetBrains Mono',monospace}
.pv{font-size:9px;padding:2px 7px;border-radius:8px;font-weight:700;flex-shrink:0}.pv.public{background:var(--accentG);color:var(--accent)}.pv.unlisted{background:var(--blueG);color:var(--blue)}.pv.private{background:var(--bg4);color:var(--t2)}

.card{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:18px;margin-bottom:14px;max-width:820px}
.card h3{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.card ol,.card ul{padding-left:20px;line-height:1.9;font-size:13px;color:var(--t2)}.card li{margin-bottom:3px}
.card code{background:var(--bg3);padding:2px 6px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--cyan);word-break:break-all}
.card pre{background:var(--bg);border:1px solid var(--bdr);border-radius:var(--rs);padding:12px;overflow-x:auto;margin:8px 0;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--cyan);line-height:1.7}
.warn{border-color:var(--gold);background:rgba(240,180,41,.07)}.warn h3{color:var(--gold)}

.ld{display:none;position:fixed;inset:0;background:rgba(11,11,17,.85);backdrop-filter:blur(8px);z-index:200;align-items:center;justify-content:center;flex-direction:column;gap:14px}.ld.on{display:flex}
.spin{width:36px;height:36px;border:3px solid var(--bdr);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.ld-t{font-size:14px;color:var(--t2)}.ld-s{font-size:11px;color:var(--t3);font-family:'JetBrains Mono',monospace}
.toast{position:fixed;bottom:16px;right:16px;background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:10px 16px;font-size:12px;color:var(--t1);z-index:300;transform:translateY(60px);opacity:0;transition:.3s;max-width:340px}.toast.show{transform:translateY(0);opacity:1}.toast.err{border-color:var(--accent)}.toast.ok{border-color:var(--cyan)}
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:900px){.side{width:100%;min-width:100%;max-height:none;position:static;border-right:none;border-bottom:1px solid var(--bdr)}.body{flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.qc-top{flex-direction:column}.qc-th{width:100%;min-width:0}}
</style>
<style>
/* ── 1.5.6 에서 이어온 규칙 (팝업·대시보드·안내 상자) ── */
.hintline{font-size:11px;color:var(--t3);line-height:1.7;margin-top:6px}
.hintline code,.p13 code,.sw code{background:var(--bg3);padding:1px 5px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--cyan)}
.basenotice{display:none;margin-top:10px;padding:10px 12px;border:1px solid var(--gold);
  border-radius:8px;background:color-mix(in srgb,var(--gold) 8%,transparent)}
.bn-head{font-size:12px;font-weight:600;color:var(--gold);margin-bottom:6px}
.bn-body{font-size:11px;color:var(--t2);line-height:1.7}
.bn-row{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:11px;
  padding:4px 0;border-top:1px solid var(--bdr)}
.bn-row span{color:var(--t3);font-family:'JetBrains Mono',monospace;font-size:10px;word-break:break-all}
.bn-warn{font-size:11px;color:var(--gold);line-height:1.7;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.flabel{display:block;font-size:11px;font-weight:700;color:var(--t3);margin-bottom:5px;letter-spacing:.3px}
.p13{font-size:13px;color:var(--t2);line-height:1.9}
.danger{margin-top:12px;padding:12px 14px;border-radius:var(--rs);background:rgba(255,68,102,.08);border:1px solid rgba(255,68,102,.35);font-size:12px;color:var(--t1);line-height:1.8}
.card ol li{margin-bottom:6px}
.tp.solo.on{display:block;padding:20px;max-width:900px}
.stats{max-width:860px}
.qlist{max-width:860px}
.pulse{animation:pl 1.4s ease-in-out infinite}@keyframes pl{0%,100%{opacity:1}50%{opacity:.45}}
.qc-meta{display:flex;flex-direction:column;gap:6px;padding:0 12px 12px}
.sw small{font-size:11px}
.tp.solo.on{max-width:1400px;margin:0 auto}
.dash{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media(max-width:1000px){.dash{grid-template-columns:1fr}}
.dash-side{display:flex;flex-direction:column;gap:12px;position:sticky;top:110px}
@media(max-width:1000px){.dash-side{position:static}}

.panel{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:14px}
.panel-h{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.5px;margin-bottom:10px}
.panel-link{display:block;margin-top:10px;padding:8px;border-radius:var(--rs);border:1px solid var(--bdr);color:var(--t2);font-size:11px;font-weight:600;text-align:center;text-decoration:none;transition:.15s}
.panel-link:hover{border-color:var(--accent);color:var(--accent)}

.ch-top{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.ch-top img{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--bg3);flex-shrink:0}
.ch-info{min-width:0}
.ch-info b{font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-info span{font-size:10px;color:var(--t3);font-family:'JetBrains Mono',monospace}
.ch-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding-top:10px;border-top:1px solid var(--bdr)}
.ch-stats div{text-align:center;min-width:0}
.ch-stats b{display:block;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--blue);overflow:hidden;text-overflow:ellipsis}
.ch-stats span{font-size:9px;color:var(--t3)}

.gauge{height:8px;border-radius:4px;background:var(--bg3);overflow:hidden;margin-bottom:6px}

.mini span{font-size:9px;color:var(--t3)}

.kv{display:flex;justify-content:space-between;gap:8px;font-size:11px;padding:5px 0;border-bottom:1px solid var(--bdr)}

.logmini{font-family:'JetBrains Mono',monospace;font-size:9.5px;line-height:1.75;color:var(--t2);max-height:190px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:0}

.drop:hover,.drop.hot{border-color:var(--accent);background:var(--bg2)}
.drop.hot{box-shadow:0 0 24px var(--accentG)}
.drop-i{font-size:34px;margin-bottom:8px;opacity:.65}
.drop-t{font-size:15px;font-weight:700;margin-bottom:4px}
.drop-d{font-size:11px;color:var(--t3);line-height:1.7}

.modal{display:none;position:fixed;inset:0;background:rgba(11,11,17,.78);backdrop-filter:blur(8px);z-index:400;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal-box{background:var(--bg1);border:1px solid var(--bdr);border-radius:14px;padding:26px 24px;width:420px;max-width:100%;text-align:center;animation:fu .25s ease both}
.modal-emoji{font-size:40px;margin-bottom:8px}
.modal-box h3{font-size:17px;font-weight:800;margin-bottom:8px}
.modal-title{font-size:12px;color:var(--cyan);font-weight:600;margin-bottom:12px;word-break:break-all;line-height:1.5}
.modal-desc{font-size:12px;color:var(--t2);line-height:1.85;margin-bottom:20px}
.howto{text-align:left;background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--rs);padding:12px 14px;margin-bottom:14px}
.howto div{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--t2);line-height:1.7;margin-bottom:5px}
.howto div:last-child{margin-bottom:0}
.howto b:first-child{flex-shrink:0;width:17px;height:17px;margin-top:2px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
.modal-note{font-size:11px;color:var(--gold);background:rgba(240,180,41,.08);border:1px solid rgba(240,180,41,.28);border-radius:var(--rs);padding:8px 10px;line-height:1.6;margin-bottom:16px}
.modal-btns{display:flex;gap:8px}
.mbtn{flex:1;padding:12px;border-radius:var(--r);border:1px solid var(--bdr);font-size:13px;font-weight:700;transition:.15s}
.mbtn.ghost{background:var(--bg2);color:var(--t2)}
.mbtn.ghost:hover{color:var(--t1);border-color:var(--t3)}
.mbtn.primary{border:none;background:linear-gradient(135deg,var(--accent),#ff8844);color:#fff}
.mbtn.primary:hover{filter:brightness(1.1)}
.modal-remember{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;font-size:10px;color:var(--t3)}
.mlink{background:none;border:none;color:var(--t3);font-size:10px;text-decoration:underline;padding:2px}
.mlink:hover{color:var(--blue)}
.must{font-size:10px;font-weight:700;color:#0b0b11;background:var(--gold);padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:middle}
.blockcard{border-color:var(--accent);background:rgba(255,68,102,.07)}
.blockcard h3{color:var(--accent)}
.dirbox{margin-top:10px;padding:11px 13px;background:var(--bg);border:1px solid var(--bdr);border-radius:var(--rs);font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--cyan);word-break:break-all;line-height:1.6}
.tro{border-top:1px solid var(--bdr);padding:12px 0;display:grid;grid-template-columns:230px 1fr;gap:14px}
.tro-q{font-size:12px;font-weight:700;color:var(--gold);line-height:1.6}
.tro-q span{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--t3);font-weight:400}
.tro-a{font-size:12px;color:var(--t2);line-height:1.8}
@media(max-width:700px){.tro{grid-template-columns:1fr;gap:6px}}
.st-val{overflow:hidden}
</style>
<style>
/* ── 여러 채널용 ─────────────────────────────── */
.chcard{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:13px;margin-bottom:9px;transition:.15s}
.chcard.off{opacity:.5}
.chcard.blocked{border-color:var(--accent)}
.chcard-top{display:flex;gap:9px;align-items:center;margin-bottom:9px;min-width:0}
.chcard-top img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--bg3);flex-shrink:0}
.chcard-nm{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chcard-sub{font-size:10px;color:var(--t3);font-family:'JetBrains Mono',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chcard-body{min-width:0;flex:1}
.chbadge{font-size:9px;padding:2px 7px;border-radius:9px;font-weight:700;flex-shrink:0}
.chbadge.ok{background:var(--cyanG);color:var(--cyan)}
.chbadge.no{background:var(--accentG);color:var(--accent)}
.chbadge.full{background:rgba(240,180,41,.14);color:var(--gold)}
.chcard .gauge{height:6px;margin-bottom:5px}
.chcard-l{display:flex;justify-content:space-between;font-size:9.5px;color:var(--t3);font-family:'JetBrains Mono',monospace}
.chcard-warn{margin-top:8px;padding:7px 9px;border-radius:var(--rs);background:var(--accentG);color:var(--accent);font-size:10.5px;line-height:1.55}
.chcard-btns{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}

.ch-tag{display:inline-flex;align-items:center;gap:4px;font-size:9px;padding:2px 7px;border-radius:9px;background:var(--bg3);color:var(--t2);font-weight:600;flex-shrink:0}

.chrow{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.chrow-h{display:flex;gap:11px;align-items:center;padding:14px;cursor:pointer}
.chrow-h:hover{background:var(--bg3)}
.chrow-h img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--bg3);flex-shrink:0}
.chrow-i{flex:1;min-width:0}
.chrow-nm{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.chrow-dc{font-size:10.5px;color:var(--t3);font-family:'JetBrains Mono',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chrow-arr{font-size:10px;color:var(--t3);transition:transform .2s}
.chrow.open .chrow-arr{transform:rotate(90deg)}
.chrow-b{display:none;padding:0 14px 14px;border-top:1px solid var(--bdr)}
.chrow.open .chrow-b{display:block}

.addch{background:var(--bg1);border:1px dashed var(--bdr);border-radius:var(--r);padding:18px}
.addch:hover{border-color:var(--accent)}
.seg{display:flex;gap:5px;margin-bottom:10px}
.seg button{flex:1;padding:9px;border-radius:var(--rs);border:1px solid var(--bdr);background:var(--bg2);color:var(--t2);font-size:12px;font-weight:600;transition:.15s}
.seg button.on{border-color:var(--accent);color:var(--accent);background:var(--accentG)}
.subhead{font-size:12px;font-weight:700;color:var(--t2);margin:16px 0 8px}
.chsel{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.chsel button{padding:6px 11px;border-radius:14px;border:1px solid var(--bdr);background:none;color:var(--t2);font-size:11px;transition:.15s}
.chsel button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.guide{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--bdr)}
.guide:first-of-type{border-top:none;padding-top:4px}
.guide-n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.guide-b{min-width:0;flex:1}
.guide-t{font-size:13.5px;font-weight:700;margin-bottom:5px}
.guide-d{font-size:12.5px;color:var(--t2);line-height:1.85}
.guide-tree{background:var(--bg);border:1px solid var(--bdr);border-radius:var(--rs);padding:11px 13px;margin:9px 0 0;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--cyan);line-height:1.75;overflow-x:auto}
.guide-tbl{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
.guide-tbl div{background:var(--bg3);border-radius:var(--rs);padding:9px 11px}
.guide-tbl b{display:block;font-size:12px;margin-bottom:2px}
.guide-tbl span{font-size:10.5px;color:var(--t3);line-height:1.5}
.guide-warn{margin-top:9px;padding:9px 11px;border-radius:var(--rs);background:rgba(240,180,41,.08);border:1px solid rgba(240,180,41,.28);font-size:11.5px;color:var(--t2);line-height:1.7}
.guide-warn b{color:var(--gold)}
@media(max-width:640px){.guide-tbl{grid-template-columns:1fr}}
.bcpanel{background:var(--bg2);border:1px solid var(--cyan);border-radius:var(--r);padding:12px;margin-bottom:6px}
.bclist{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;max-height:260px;overflow:auto}
.bcrow{display:flex;align-items:center;gap:9px;padding:8px 10px;background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--rs);transition:.15s;cursor:pointer}
.bcrow.on{border-color:var(--cyan);background:var(--cyanG)}
.bcrow .mark{width:17px;height:17px;border-radius:5px;border:1px solid var(--bdr);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent}
.bcrow.on .mark{background:var(--cyan);border-color:var(--cyan);color:#0b0b11}
.bcrow-n{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcrow-m{font-size:10px;color:var(--t3);font-family:"JetBrains Mono",monospace;flex-shrink:0}
.bcbar{border-top:1px solid var(--bdr);padding-top:10px}
.bcbtns{display:flex;gap:6px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.bcbox{margin:8px 0 4px;padding:10px 12px;border-radius:var(--rs);background:var(--cyanG);border:1px solid rgba(45,212,168,.35);font-size:11.5px;color:var(--t2);line-height:1.7}
.bcbox b{color:var(--cyan)}
</style>
<style>
.upnotes{white-space:pre-wrap;text-align:left;background:#f6f7f9;border:1px solid #e5e7eb;
  border-radius:8px;padding:11px 13px;margin:10px 0 2px;font-size:12.5px;line-height:1.75;
  color:#374151;max-height:180px;overflow-y:auto}
@media (prefers-color-scheme: dark){
  .upnotes{background:#111827;border-color:#374151;color:#d1d5db}
}
#물러남덮개{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;
  justify-content:center;background:rgba(255,255,255,.94);backdrop-filter:blur(3px)}
#물러남덮개 .속{text-align:center;font-family:inherit;padding:30px}
#물러남덮개 h2{font-size:19px;margin-bottom:12px}
#물러남덮개 p{color:#6b7280;font-size:13.5px;line-height:1.8;margin-bottom:20px}
#물러남덮개 button{padding:10px 18px;border:1px solid #d1d5db;background:#fff;
  border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit}
#물러남덮개 button:hover{background:#f3f4f6}
@media (prefers-color-scheme: dark){
  #물러남덮개{background:rgba(17,24,39,.94)}
  #물러남덮개 h2{color:#f3f4f6}
  #물러남덮개 button{background:#1f2937;border-color:#374151;color:#e5e7eb}
}
</style>
<style>
/* 2.0 에서 더한 작은 부품 — 옛 색·글꼴 변수만 쓴다 (새 색을 들이지 않는다) */
.pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10px;font-weight:700;border:1px solid var(--bdr);color:var(--t2);background:var(--bg2);white-space:nowrap}
.pill.kind-s{color:var(--cyan);border-color:rgba(45,212,168,.4);background:var(--cyanG)}
.pill.kind-l{color:var(--blue);border-color:rgba(76,141,255,.4);background:var(--blueG)}
.pill.warn{color:var(--gold);border-color:rgba(240,180,41,.4)}
.pill.err{color:var(--accent);border-color:rgba(255,68,102,.4);background:var(--accentG)}
.lamp{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;border:1px solid var(--bdr);background:var(--bg2);font-size:11px;color:var(--t2);cursor:pointer}
.lamp i{width:8px;height:8px;border-radius:50%;background:var(--t3);display:inline-block}
.lamp.green i{background:var(--cyan);box-shadow:0 0 6px var(--cyanG)}
.lamp.yellow i{background:var(--gold)}
.lamp.red i{background:var(--accent)}
.hide{display:none!important}
</style>
</head>
<body>
<header class="hdr">
  <div class="logo"><em>🚀</em> <b>가라사대</b>&nbsp;업로더</div>
  <div class="hdr-r">
    <button class="lamp" id="lamp" onclick="openIssues()" title="문제가 있는지 한눈에 — 누르면 자세히"><i></i><span id="lampTxt">확인 중…</span></button>
    <button class="sm" id="lockBtn" onclick="toggleLock()" title="켜면 업로드와 공개가 모두 멈춥니다">🔓 잠금 꺼짐</button>
    <button class="sm" id="nightBtn" onclick="toggleNight()" title="자정~아침 7시 발사 금지">🌙 심야 금지</button>
    <button class="sm login" id="cpBtn" onclick="if(typeof openCoupang==='function')openCoupang()" title="영상마다 소재에 맞는 쿠팡 상품 링크를 설명 끝에 자동으로 붙입니다 — 내 파트너스 열쇠를 넣으면 수수료가 내 계정으로 들어갑니다">🛒 쿠팡 파트너스 연결</button>
    <button class="sm" onclick="swTab('t3')">📺 채널 관리</button>
    <button class="sm" id="pauseBtn" onclick="togglePause()">⏸ 일시정지</button>
    <div class="api-st"><div class="dot" id="dot"></div><span id="stTxt">확인 중…</span></div>
  </div>
</header>

<div class="tabs">
  <button class="tab on" data-tab="t1" onclick="swTab('t1')">👀 감시 중</button>
  <button class="tab" data-tab="t2" onclick="swTab('t2')">📋 기록</button>
  <button class="tab" data-tab="t7" onclick="swTab('t7')">📊 성적</button>
  <button class="tab" data-tab="t3" onclick="swTab('t3')">📺 채널</button>
  <button class="tab" data-tab="t4" onclick="swTab('t4')">⚙️ 설정</button>
  <button class="tab" data-tab="t5" onclick="swTab('t5')">🚀 시작하기</button>
  <button class="tab" data-tab="t6" onclick="swTab('t6')">💬 의견</button>
</div>
